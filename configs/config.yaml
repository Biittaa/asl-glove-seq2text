# ============================================================================
# Configuration for the ASL sensor-to-text Transformer (no CNN/GRU sign
# embedding; the model starts directly at the Transformer encoder, as
# requested). Edit the paths below to match your Google Drive layout before
# running train.py (or override them from the CLI / from the Colab notebook).
# ============================================================================

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  # Root of the *unzipped* dataset folder as produced by the packaging step,
  # i.e. the folder that directly contains: data/, manifests/, metadata.json
  # Example (Colab, folder uploaded as-is to Drive, not as a zip):
  #   /content/drive/MyDrive/ASL_model_ready_dataset_processed/asl_training_dataset
  dataset_root:  "D:/Desk/SignLanguageTranslation/ASL_model_ready_dataset_processed/asl_training_dataset"


  train_split: "train"
  val_split: "validation"
  test_split: "test"
  split:
    mode: "subject"   # "subject" | "random" | "compositional"
    all_manifest: "manifests/all.jsonl"
    random_seed: 42
    random_ratios:                    
      train: 0.8108
      validation: 0.1351
      test: 0.0541
    compositional:                    
      unseen_sentence_fraction: 0.15  
      train_recording_ratio: 0.85   
      seed: 42
    paper:
      held_out_subject: "subject2"
      val_fraction: 0.5
      seed: 42

  # Which label field is used for each loss (see README for details):
  #   - CTC loss is computed on the *gesture-order* label (no fixed word order)
  #   - Cross-entropy loss is computed on the *spoken-order* label
  ctc_label_field: "label_no_order"
  ce_label_field: "label_order"

  num_workers: 2
  pin_memory: true

  norm_mode: "recording"

# ---------------------------------------------------------------------------
# Vocabulary
# ---------------------------------------------------------------------------
vocab:
  # Vocabularies are always built from the TRAIN split only (no leakage from
  # val/test) and then cached to disk so every run/inference uses the same
  # token <-> id mapping.
  out_dir: "artifacts/vocab"
  gloss_vocab_file: "gloss_vocab.json"   # CTC target vocabulary (words as classes)
  word_vocab_file: "word_vocab.json"     # Decoder target/source vocabulary

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  # Raw per-frame feature dimensionality (from metadata.json: feature_count)
  input_feature_dim: 38

  d_model: 128
  nhead: 4
  dim_feedforward: 512
  dropout: 0.3

  encoder_layers: 3
  decoder_layers: 2

  max_encoder_len: 1024     # >= dataset "maximum_frames" (831), with margin
  max_decoder_len: 64       # >= longest word_order sentence + <bos>/<eos>

  # CNN front-end that downsamples the frame axis before the Transformer
  # encoder, to cut self-attention's O(T^2) cost. conv_num_layers stride-2
  # conv layers together shrink T by conv_stride**conv_num_layers (4x by
  # default), so attention cost drops by roughly that squared (~16x).
  # Set use_conv_subsampling: false to restore the old no-CNN behaviour
  # (a single linear projection, T unchanged).
  use_conv_subsampling: true
  conv_kernel_size: 5
  conv_stride: 2
  conv_num_layers: 2

  two_hand: true          
  hand_feature_dim: 19      
  hand_d_model: 128       
  fusion: "cross_attention"         
  fusion_nhead: 4 
  hand_encoder_layers: 0

  use_gnn: false
  gnn_hidden: 32
  gnn_layers: 2
  gnn_adaptive: true       # learnable residual on top of the skeleton adjacency
  gnn_cross_hand: true     # only used when two_hand: false

# ---------------------------------------------------------------------------
# Loss weights (Eq. 32 in the reference paper: L = lambda_ctc * L_ctc + lambda_ce * L_ce)
# ---------------------------------------------------------------------------
loss:
  lambda_ctc: 0.7
  lambda_ce: 0.3
  label_smoothing: 0.1   # applied only to the cross-entropy (decoder) loss

# ---------------------------------------------------------------------------
# Optimization
# ---------------------------------------------------------------------------
train:
  epochs: 100
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 800
  grad_clip_norm: 5.0
  amp: true                 # mixed precision (recommended on Colab GPU)
  seed: 42

  log_every: 50
  eval_every_epochs: 1
  ckpt_dir: "artifacts/checkpoints"
  best_metric: "val_wer"    # lower is better; tracked on the decoder output
  early_stop_patience: 15   # epochs without improvement, 0 = disabled
  eval_train_every_epochs: 1
  predictions_dir: "artifacts/predictions"
# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
runtime:
  device: "cuda"   # falls back to "cpu" automatically if CUDA unavailable
